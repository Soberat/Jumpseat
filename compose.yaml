# Jumpseat + a Tailscale sidecar. By default the app has no published ports: it is only
# reachable on your tailnet at https://<TS_HOSTNAME>.<your-tailnet>.ts.net, with HTTPS from Tailscale.
# `docker compose --profile lan up -d` also serves it over plain HTTP on your local network.
services:
  tailscale:
    image: tailscale/tailscale:stable
    hostname: ${TS_HOSTNAME:-jumpseat}
    environment:
      # Optional: without a key, `docker compose logs tailscale` prints a login link instead.
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_HOSTNAME=${TS_HOSTNAME:-jumpseat}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/${TS_SERVE_CONFIG:-serve.json}
      - TS_USERSPACE=false
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./deploy/tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  app:
    build: .
    image: jumpseat:latest
    # Share the sidecar's network so `tailscale serve` can reach the app on 127.0.0.1:3000.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    environment:
      - DATABASE_URL=/data/jumpseat.db
      - PUBLIC_ORIGIN=${PUBLIC_ORIGIN:-}
      # Both entrances (tailscale serve, and the optional LAN proxy) set this header,
      # so the app knows whether a request arrived over HTTPS or plain HTTP.
      - PROTOCOL_HEADER=x-forwarded-proto
    volumes:
      - jumpseat-data:/data
    restart: unless-stopped

  # Optional plain-HTTP entrance for your local network: http://<server-ip>:${LAN_PORT:-80}
  lan:
    image: caddy:2-alpine
    profiles: [lan]
    command: caddy reverse-proxy --from :80 --to tailscale:3000
    ports:
      - ${LAN_PORT:-80}:80
    depends_on:
      - app
    restart: unless-stopped

volumes:
  tailscale-state:
  jumpseat-data:
